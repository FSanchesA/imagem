<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#12372A"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"

  <meta
    name="apple-mobile-web-app-title"
    content="Mapa da Força"
  >

  <title>Mapa da Força</title>


  <!-- ÍCONE DO IPHONE -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="icon.png"
  >


  <!-- FAVICON -->
  <link
    rel="icon"
    type="image/png"
    href="icon.png"
  >


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #12372A;

    }

      position: fixed;

      inset: 0;

    }


    iframe {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #F5F8F6;

    }

  </style>

</head>
